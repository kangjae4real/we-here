openapi: 3.1.0
info:
  title: we-here API
  version: 0.1.0-draft
  summary: 두 사람의 사진 위치로 '스친 순간'을 찾는 we-here의 NestJS API 계약 초안
  description: |
    NestJS(`apps/api`) 구현 전에 합의하기 위한 **설계 우선(design-first) 계약 초안**이다.

    **근거 자료**
    - Figma Make 프로토타입 "두 사람의 스친 순간 찾기" (화면 01~10, 상태 S1~S8)
    - `docs/designs/we-here.md`의 API 계약과 수용 항목(O3, O6, O12, O14, O23, X3, X5, X6, X8, X9, E2, E3, E9, E10, E21, E22, E27, G1)

    **공통 규칙**
    - 브라우저는 API를 직접 부르지 않는다. web의 `next.config.ts` rewrites가 `/api/v1/*`를 이 API로 프록시한다.
      이 문서의 경로에는 `/api/v1` 접두어가 없다.
    - 인증: `X-Participant-Token` 헤더. 예외는 `GET /health`, `POST /rooms`, `GET /rooms/{roomId}/invite`,
      `POST /rooms/{roomId}/participants`, `GET /thumbs/{photoId}`(서명으로 인증) 다섯 개다.
    - 오류 본문은 모두 `application/problem+json`(`Problem`)이고, 화면 분기는 `status`가 아니라 `code`로 한다.
    - 토큰이 없거나 이 방의 어떤 참여자와도 맞지 않으면 **401 `invalid_token`만** 준다.
      403은 권한 거부(남의 사진, 썸네일 서명, 초대 비밀값, AI 동의)에만, 404는 대상이 없을 때만 쓴다.
    - 방을 바꾸는 요청(업로드, 삭제, 참여, 나가기, 내보내기, 만난 날 수정, AI 동의 변경)은 행이 하나 이상 바뀌면
      `rooms.revision`을 정확히 1 올리고 새 `revision`을 응답에 담는다.
    - 채팅 메시지는 `revision`을 올리지 않는다(스냅샷과 무관). 상대의 새 메시지는 `GET /rooms/{roomId}`의 `chatLastMessageId`로 알아챈다.
    - JSON 응답에는 `Cache-Control: no-store`, 모든 응답에는 `X-Content-Type-Options: nosniff`를 붙인다.
    - 모든 응답 헤더와 오류 본문에 `x-request-id`(`requestId`)가 있다.

    **프론트엔드는 이 API하고만 통신한다**
    - 외부 서비스 호출(LLM, 네이버 역지오코딩)은 모두 이 API가 서버에서 한다. 키는 API 서버에만 있다.
    - AI 채팅도 이 API의 `POST /rooms/{roomId}/chat`이 맡는다. Next.js 채팅 Route Handler는 두지 않는다.
    - 채팅 모델은 서버 env로 하나만 고른다. 모델 선택 옵션과 모델 관련 요청 필드는 없다.
    - 채팅 기록은 방 단위로 서버에 저장하고 두 참여자가 같은 대화를 본다. 방이 만료되면 함께 지운다.
    - **LLM 제공자는 아직 정하지 않았다.** 이 계약은 제공자와 무관하게 만든다.
      서버는 `LlmProvider` 인터페이스(스트리밍 생성 하나) 뒤에 제공자별 어댑터를 두고,
      env `LLM_PROVIDER`(예: `nvidia`, `openai`, `anthropic`, `gemini`), `LLM_MODEL`, `LLM_API_KEY`,
      `LLM_BASE_URL`(OpenAI 호환 엔드포인트일 때만)로 고른다. 제공자를 바꿔도 요청·응답·오류 code는 그대로다.
      제공자 이름과 모델 이름은 응답에 싣지 않는다.
    - 예외: 네이버 지도 JS SDK와 지도 타일은 브라우저가 네이버에서 직접 받는다(지도 SDK 구조상 프록시할 수 없다).

    **이 API로 오지 않는 것**
    - "위치 없음 / 촬영 시각 없음" 집계(화면 06c)는 브라우저가 EXIF를 읽고 걸러낸 결과라 API로 오지 않는다.
servers:
  - url: http://localhost:4000
    description: 로컬 API 직접 호출
  - url: http://localhost:3000/api/v1
    description: web 프록시 경유 (브라우저가 쓰는 경로)
tags:
  - name: system
    description: 상태 확인
  - name: rooms
    description: 방 만들기, 초대, 참여, 설정 (화면 01~04, 10, S2, S7, S8)
  - name: photos
    description: 사진 메타데이터와 썸네일 업로드·삭제 (화면 06a~06d, S3)
  - name: analysis
    description: 기록, 리플레이, 스친 순간, 히트맵 데이터 (화면 05, 07~08, S1, S4)
  - name: chat
    description: AI 채팅과 방별 대화 기록 (화면 09, S5, S6). 모델은 서버에서 고정한다.

security:
  - ParticipantToken: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 서버와 DB 연결 확인
      description: 발표 전 API를 미리 깨울 때도 쓴다. DB 쿼리까지 성공해야 200이다.
      security: []
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: DB 연결 실패
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      checks:
                        type: object
                        properties:
                          db:
                            type: string
                            enum: [ok, fail]

  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: 방 만들기 (화면 02a~02c)
      description: |
        방을 만들고 만든 사람을 참여자 A로 자동 참여시킨다.
        응답의 `token`은 이 응답에서만 받을 수 있다(서버는 SHA-256 해시만 저장한다).
        초대 링크는 FE가 `/r/{roomId}#i={inviteSecret}`, 내 다른 기기 링크는 `/r/{roomId}#t={token}`으로 만든다.
        IP당 시간당 `ROOM_CREATE_LIMIT_PER_HOUR`회(기본 10)로 제한한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
            example:
              name: 우리 둘의 지도
              nickname: 서연
              metOn: '2024-03-02'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoomResponse'
              example:
                roomId: Zk3uP1xQx0aN8sYbVb2c9w
                participantId: 6f1c2a9e-1c7b-4c1e-9a40-0b6f6e1f3a11
                token: Q2l0eS1vZi1saWdodHMtYW5kLXJpdmVy
                inviteSecret: 8fk2-syQvT0pLx3mR9aW1bg
                expiresAt: '2024-04-01T00:00:00Z'
                revision: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /rooms/{roomId}/invite:
    get:
      tags: [rooms]
      operationId: getInvitePreview
      summary: 초대 미리보기 (화면 04, S7, S8)
      description: |
        초대 링크로 들어온 사람에게 보여줄 정보다. 토큰이 필요 없고 초대 비밀값으로 확인한다.
        `status`가 `full`이면 FE는 S7 "이 방은 이미 두 명이 꽉 찼어"를 보여준다.
        만료된 방은 404 `room_expired`(S8)이다.
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: X-Invite-Secret
          in: header
          required: true
          description: 초대 링크 fragment `#i=` 뒤의 값
          schema:
            $ref: '#/components/schemas/Secret'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 미리보기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
              example:
                roomId: Zk3uP1xQx0aN8sYbVb2c9w
                name: 우리 둘의 지도
                inviterNickname: 서연
                metOn: '2024-03-02'
                status: open
                vacantSlot: B
        '403':
          $ref: '#/components/responses/InviteInvalid'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /rooms/{roomId}/participants:
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: 초대받은 사람 입장 (화면 04)
      description: |
        참여자 B로 들어온다. 방 행을 잠근 뒤 처리하므로 동시에 두 명이 들어와도 한 명만 성공한다.
        IP당 시간당 10회 제한은 `POST /rooms`와 같다.
      security: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRoomRequest'
            example:
              nickname: 도윤
              inviteSecret: 8fk2-syQvT0pLx3mR9aW1bg
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '201':
          description: 참여 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRoomResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/InviteInvalid'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '409':
          description: 정원(2명)이 이미 찼다 (S7)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://we-here.app/problems/room_full
                title: Room is full
                status: 409
                code: room_full
                requestId: 7c0e2b1d-5a8f-4e7a-9b1d-2f6c3e8a9d10
        '429':
          $ref: '#/components/responses/RateLimited'

  /rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: 방 정보 (상단 바, 기록 탭 숫자, 방 설정, 폴링)
      description: |
        방 화면은 이전 응답이 끝나고 10초 뒤 이 요청을 다시 보낸다(겹치지 않는 폴링).
        `revision`이 알고 있는 값보다 커지면 `GET /rooms/{roomId}/snapshot`을 다시 받는다.
        상대가 아직 없으면 `participants`가 1명이다(S2). 404를 받으면 FE는 저장된 토큰을 지운다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 방 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              example:
                roomId: Zk3uP1xQx0aN8sYbVb2c9w
                name: 우리 둘의 지도
                metOn: '2024-03-02'
                expiresAt: '2024-04-01T00:00:00Z'
                revision: 14
                meId: 6f1c2a9e-1c7b-4c1e-9a40-0b6f6e1f3a11
                inviteSecret: null
                participants:
                  - id: 6f1c2a9e-1c7b-4c1e-9a40-0b6f6e1f3a11
                    nickname: 서연
                    slot: A
                    photoCount: 128
                    aiConsent: true
                  - id: 0d8b7c55-2e14-4f7a-8a6e-1b2c3d4e5f60
                    nickname: 도윤
                    slot: B
                    photoCount: 96
                    aiConsent: true
                chat:
                  used: 3
                  limit: 30
                  resetAt: '2024-03-20T13:00:00Z'
                chatLastMessageId: 7c1e2f0a-9b3d-4e5f-8a6b-0c1d2e3f4a5b
                photoLimit: 2000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RoomNotFound'
    patch:
      tags: [rooms]
      operationId: updateRoom
      summary: 처음 만난 날 바꾸기 (화면 10)
      description: 두 참여자 모두 바꿀 수 있다. 바뀌면 1·2막과 3막 경계가 달라지므로 `revision`이 오른다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
            example:
              metOn: '2024-03-02'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRoomResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RoomNotFound'

  /rooms/{roomId}/participants/me:
    patch:
      tags: [rooms, chat]
      operationId: updateMe
      summary: AI 채팅 동의 켜기·철회
      description: |
        두 참여자가 모두 `aiConsent: true`여야 `POST /rooms/{roomId}/chat`이 동작한다.
        한 명이라도 철회하면 이후 채팅 요청은 403 `ai_consent_required`이다.
        상대를 내보내고 새로 들어온 사람은 `false`로 시작한다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMeResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RoomNotFound'
    delete:
      tags: [rooms]
      operationId: leaveRoom
      summary: 방 나가기 (화면 10b)
      description: |
        내 사진과 내 자리를 지운다. 남은 사람이 없으면 방도 지운다.
        방의 채팅 기록도 모두 지운다(AI 답변에 나간 사람의 사진에서 나온 내용이 섞여 있다).
        남은 사람이 있으면 초대 비밀값을 새로 만든다(예전 초대 링크는 403).
        Nest 라우트는 `participants/me`를 `participants/:participantId`보다 먼저 선언한다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 나감
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRoomResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RoomNotFound'

  /rooms/{roomId}/participants/{participantId}:
    delete:
      tags: [rooms]
      operationId: removePartner
      summary: 상대 자리 비우기 (화면 10a)
      description: |
        상대의 자리와 그 사진을 모두 지운다. 상대가 개인 링크(토큰)를 잃었을 때 쓰는 유일한 예외 동작이다.
        방의 채팅 기록도 모두 지운다(나가기와 같은 이유).
        초대 비밀값을 새로 만들어 응답에 담는다(FE는 새 초대 링크로 S2 화면을 보여준다).
        자기 자신의 id면 400 `validation_failed`다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 비움
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovePartnerResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 방이 없거나(`room_not_found`, `room_expired`), 그 참여자가 이 방에 없다(`participant_not_found`, FE는 토큰을 지우지 않는다)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /rooms/{roomId}/photos:
    post:
      tags: [photos]
      operationId: uploadPhotos
      summary: 사진 메타데이터·썸네일 배치 업로드 (화면 06b)
      description: |
        브라우저가 EXIF에서 읽은 값과 긴 변 320px JPEG 썸네일만 보낸다. 원본 사진은 오지 않는다.
        FE는 좌표와 `DateTimeOriginal`이 둘 다 있는 사진만 보내고, 요청 하나를 **50장 또는 2MB** 중 먼저 닿는 쪽으로 자른다.

        **multipart 구성**
        - part `meta`: `PhotoMeta` JSON 배열
        - part `thumb_{clientIndex}`: 해당 사진의 JPEG 썸네일(40KB 이하). 썸네일이 없으면 생략한다.

        **저장 규칙**
        - `(participantId, dedupeKey)`가 이미 있으면 덮어쓰지 않고 `duplicate`다.
          단, 기존 썸네일이 없거나 새 썸네일보다 작으면 썸네일만 채운다.
        - 사진 하나가 잘못되면 그 사진만 `error`이고 나머지는 저장된다.
        - 참여자당 `PHOTO_LIMIT_PER_PARTICIPANT`(기본 2,000)를 넘는 사진은 `photo_limit_reached`다.
        - 좌표는 소수 4자리(약 11m)로 반올림해 저장한다.
        - 하나라도 저장되면 `revision`이 1 오르고, 전부 `duplicate`면 그대로다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta]
              properties:
                meta:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/PhotoMeta'
              additionalProperties:
                description: '`thumb_{clientIndex}` 이름의 JPEG 파일 파트'
                type: string
                contentMediaType: image/jpeg
            encoding:
              meta:
                contentType: application/json
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 사진별 결과 (요청 `meta` 순서와 같다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPhotosResponse'
              example:
                revision: 15
                results:
                  - clientIndex: 0
                    dedupeKey: 3f2a6c0e9b1d4a7f8e2c5b9a0d1f3e6c7b8a9d0e1f2a3b4c5d6e7f8091a2b3c4
                    status: saved
