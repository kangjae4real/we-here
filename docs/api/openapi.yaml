  /thumbs/{photoId}:
    get:
      tags: [photos]
      operationId: getThumbnail
      summary: 썸네일 이미지 (서명 URL)
      description: |
        `<img>`는 헤더를 보낼 수 없어서 토큰 대신 서명으로 인증한다.
        `sig = HMAC-SHA256(THUMB_SIGNING_SECRET, photoId + "." + exp)`(hex), 유효 기간 최대 24시간이며 방의 `expiresAt`을 넘지 않는다.
        스냅샷의 `thumbUrl`이 이 경로를 상대 경로로 담고, FE가 앞에 `/api/v1`을 붙인다.
        로드에 실패하면 FE는 스냅샷을 한 번 다시 받아 URL을 바꾼다.
      security: []
      parameters:
        - $ref: '#/components/parameters/PhotoId'
        - name: exp
          in: query
          required: true
          description: 만료 시각 (Unix 초, 1시간 단위로 올림)
          schema:
            type: integer
        - name: sig
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: JPEG 썸네일
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, max-age=86400
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        '403':
          description: 서명이 틀렸거나 만료됐다 (`thumb_signature_invalid`, `thumb_signature_expired`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 사진이 지워졌거나 방이 만료됐다 (`photo_not_found`, `room_expired`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /rooms/{roomId}/snapshot:
    get:
      tags: [analysis]
      operationId: getSnapshot
      summary: 방 화면 데이터 한 벌 (화면 05, 07~08, S1, S4)
      description: |
        사진 목록과 분석 결과(스친 순간, 히트맵, 3막 스토리, 기록 탭 요약)를 **REPEATABLE READ 트랜잭션 하나**에서 읽어 돌려준다.
        그래서 `encounters`가 `photos`에 없는 사진을 가리키는 일이 없다.

        **분석 규칙 요약**
        - 만난 날 기준: 사진의 현지 날짜 `< metOn`이면 "만나기 전"(1·2막), `>= metOn`이면 "만난 후"(3막).
        - 스친 순간(2막): 두 사진 모두 만나기 전, ±10분, 250m 이내. 30분 이내로 이어지고 첫 후보와 500m 안이면 하나로 묶는다.
          두 사람의 `dedupeKey`가 같은 쌍(공유받은 같은 사진)은 뺀다.
        - 1막(같은 곳, 다른 때): 만나기 전 두 사람이 모두 다녀간 약 150m 칸 중 스친 순간이 아닌 곳. 시간 차가 작은 순으로 최대 10칸.
        - 히트맵·3막: 만난 후 칸별 **서로 다른 날 수**(같은 날 50장도 1일). 둘 중 **누구라도** 그날 그 칸에 사진을 남겼으면 센다.
          두 사람이 같은 날 함께 갔는지는 따지지 않는다. 그래서 화면 문구는 "함께 간 곳"이 아니라 "만난 뒤 우리 기록"이다(O20).

        **장소 이름(`placeLabel`) 채우는 시점**
        - 화면에 이름이 나오는 항목(스친 순간, 가장 가까웠던 순간, 1막 카드, 히트맵 `top`, 기록 탭 `stats`)만
          이 요청 안에서 역지오코딩한다. 좌표 소수 3자리(약 100m) 키로 DB에 캐시하고, 동시 4개·전체 3초 예산을 넘으면 null로 둔다.
        - null이었던 이름은 다음 스냅샷 요청 때 다시 시도한다. 이름이 채워져도 `revision`은 오르지 않는다.
        - `photos[].placeLabel`과 `heatmap.cells[].placeLabel`은 캐시에 있을 때만 채우고 새로 조회하지 않는다.
        - 한국 밖 좌표는 조회하지 않고 "해외"로 쓴다.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
        '200':
          description: 스냅샷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
