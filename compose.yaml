services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wehere
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wehere"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    profiles: [app]
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/wehere
      THUMB_SIGNING_SECRET: ${THUMB_SIGNING_SECRET:-dev-only-thumb-secret-change-me-0123456789}
      GEOCODER: ${GEOCODER:-fake}
      NCP_CLIENT_ID: ${NCP_CLIENT_ID:-}
      NCP_CLIENT_SECRET: ${NCP_CLIENT_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Hot-reload web dev server: `docker compose --profile dev up web-dev`.
  # Source is bind-mounted; node_modules and .next stay in container volumes so
  # the host's macOS binaries never mix with the Linux ones.
  web-dev:
    profiles: [dev]
    build:
      context: .
      target: base
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm-store --config.confirmModulesPurge=false && pnpm --filter web dev -H 0.0.0.0"
    volumes:
      - .:/repo
      - web-dev-root-modules:/repo/node_modules
      - web-dev-web-modules:/repo/apps/web/node_modules
      - web-dev-api-modules:/repo/apps/api/node_modules
      - web-dev-next:/repo/apps/web/.next
      - pnpm-store:/pnpm-store
    ports:
      - "3000:3000"

volumes:
  db-data:
  web-dev-root-modules:
  web-dev-web-modules:
  web-dev-api-modules:
  web-dev-next:
  pnpm-store:
